services:
  groundstation:
    build:
      context: .
      dockerfile: Dockerfile
    image: pronto_gr16:latest
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FOSM_FLASK_HOST: 0.0.0.0
      FOSM_FLASK_PORT: 5000
      FOSM_FLASK_DEBUG: "0"
      FOSM_ALLOW_UNSAFE_WERKZEUG: "1"
      FOSM_UHD_DEVICE_ARGS: "type=b200"
    privileged: true
    device_cgroup_rules:
      - 'c 189:* rmw'
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped
